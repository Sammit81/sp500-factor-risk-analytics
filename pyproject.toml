[project]
name = "sp500-factor-risk-analytics"
version = "0.1.0"
description = "Multi-signal factor backtest and portfolio risk analytics on the S&P 500 universe"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "google-cloud-bigquery>=3.25.0",
    "db-dtypes>=1.2.0",
    "dbt-bigquery>=1.8.0",
    "python-dotenv>=1.2.1",
    "matplotlib>=3.8.0",
    "lxml>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
