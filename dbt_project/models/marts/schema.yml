version: 2

models:
  - name: dim_ticker
    description: "One row per ticker (S&P 500 constituents + SPY benchmark)"
    columns:
      - name: TICKER
        data_tests:
          - not_null
          - unique

  - name: fct_price_returns
    description: "Daily price and return history. Grain: TICKER x PRICE_DATE."
    columns:
      - name: TICKER
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_ticker')
                field: TICKER
      - name: PRICE_DATE
        data_tests:
          - not_null
      - name: CLOSE_PRICE
        data_tests:
          - not_null

  - name: fct_signal_scores
    description: "Combined and individual factor signal scores. Grain: TICKER x PRICE_DATE."
    columns:
      - name: TICKER
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_ticker')
                field: TICKER
      - name: PRICE_DATE
        data_tests:
          - not_null

  - name: dim_date
    description: "Standard date dimension, 2020-2030, for the Power BI layer"
    columns:
      - name: Date
        data_tests:
          - not_null
          - unique

  - name: dim_strategy
    description: "One row per backtest strategy, classified by StrategyType"
    columns:
      - name: Strategy
        data_tests:
          - not_null
          - unique

  - name: fct_backtest_returns
    description: "Daily returns per strategy. Grain: Strategy x Date."
    columns:
      - name: Strategy
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_strategy')
                field: Strategy
      - name: Date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: Date

  - name: fct_backtest_turnover
    description: "Per-rebalance turnover, cost, and holding count per strategy. Grain: Strategy x RebalanceDate."
    columns:
      - name: Strategy
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_strategy')
                field: Strategy
      - name: RebalanceDate
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: Date
