# sources.yml — RAW_PRICES lives in the same dataset this project writes to.
# schema must be set explicitly: omitting it makes dbt default to the source
# block's `name:` as the dataset, not the target dataset (a bug hit and fixed
# on the sibling financial-markets-analytics project).

version: 2

sources:
  - name: raw
    schema: "{{ env_var('BQ_DATASET') }}"
    tables:
      - name: RAW_PRICES
        description: "Raw OHLCV price data for the S&P 500 universe + SPY, fetched via yfinance"
        columns:
          - name: TICKER
            description: "Yahoo Finance ticker symbol"
          - name: PRICE_DATE
            description: "Trading date"
          - name: CLOSE
            description: "Adjusted closing price"
      - name: RAW_BACKTEST_RETURNS
        description: "Daily returns per strategy (4 standalone signals, combined, long-short diagnostic, SPY benchmark), written by backtest/persist_results.py. Full overwrite each run, not incremental."
        columns:
          - name: STRATEGY
            description: "Strategy label, e.g. 'Momentum', 'Combined (all 4)', 'SPY (benchmark)'"
          - name: DATE
          - name: DAILY_RETURN
      - name: RAW_BACKTEST_TURNOVER
        description: "Per-rebalance turnover, transaction cost, and holding count per strategy"
        columns:
          - name: STRATEGY
          - name: REBALANCE_DATE
          - name: TURNOVER
          - name: COST
          - name: N_HOLDINGS
