version: 2

models:
  - name: stg_prices
    description: "Cleaned and type-cast price data for the S&P 500 universe + SPY"
    columns:
      - name: TICKER
        data_tests:
          - not_null
      - name: PRICE_DATE
        data_tests:
          - not_null
      - name: CLOSE_PRICE
        data_tests:
          - not_null

  - name: stg_backtest_returns
    description: "Cleaned daily returns per strategy"
    columns:
      - name: STRATEGY
        data_tests:
          - not_null
      - name: RETURN_DATE
        data_tests:
          - not_null

  - name: stg_backtest_turnover
    description: "Cleaned per-rebalance turnover per strategy"
    columns:
      - name: STRATEGY
        data_tests:
          - not_null
      - name: REBALANCE_DATE
        data_tests:
          - not_null
